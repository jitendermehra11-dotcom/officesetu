name: Build officesetu APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: false 
                      
      - name: Generate Android Platform & Get Dependencies
        run: flutter create . --platforms=android --org com.officesetu.app && flutter pub get

      - name: Fix minSdkVersion & Enable MultiDex Automatically
        run: |
          python3 -c "p='android/app/build.gradle'; d=open(p).read(); d=d.replace('minSdkVersion 19','minSdkVersion 21').replace('minSdkVersion 16','minSdkVersion 21').replace('minSdkVersion flutter.minSdkVersion','minSdkVersion 21'); open(p,'w').write(d)"
          python3 -c "p='android/app/build.gradle'; d=open(p).read(); d=d.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true'); open(p,'w').write(d)"

      - name: Set Gradle JVM Memory & AndroidX
        run: |
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Clean Project
        run: flutter clean

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with: 
          name: officesetu-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
