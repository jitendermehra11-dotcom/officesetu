name: Build officesetu APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: false 
                        
      - name: Generate Android Platform & Get Dependencies
        run: |
         flutter create . --platforms=android --org com.officesetu.app
         flutter pub get


          - name: Fix minSdkVersion to 21
            run: |
            python3 -c "
            path = 'android/app/build.gradle'
            with open(path, 'r') as f:
            content = f.read()
            content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
            content = content.replace('minSdkVersion 19', 'minSdkVersion 21')
            content = content.replace('minSdkVersion 16', 'minSdkVersion 21')
            with open(path, 'w') as f:
            f.write(content)
           "
        
      - name: Clean Project
        run: flutter clean

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: officesetu-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

          
